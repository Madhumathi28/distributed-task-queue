services:
  api:
    build: .
    container_name: taskqueue-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: taskqueue-worker
    command: ["./worker"]
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: taskqueue-postgres
    environment:
      POSTGRES_USER: taskqueue
      POSTGRES_PASSWORD: taskqueue
      POSTGRES_DB: taskqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taskqueue-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: